name: Android CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Check and build Release
        run: ./gradlew --no-daemon check assembleRelease

      # Signing credentials are kept off this fork's CI. Installable signed APKs
      # are published separately as verified GitHub Release assets.
      - name: Upload unsigned Release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: i-am-pad-release-unsigned
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
